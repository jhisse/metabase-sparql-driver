name: Build and Release Driver

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

# A new push to a pull request cancels its outdated run. Runs on main and on
# tags (releases) always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned, so a new Clojure CLI release cannot change a build unannounced.
  CLOJURE_CLI_VERSION: 1.12.6.1673

permissions: {}

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Clojure Tools
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: ${{ env.CLOJURE_CLI_VERSION }}

      - name: Cache Clojure dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clojure-lint-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-lint-
            ${{ runner.os }}-clojure-

      - name: Run Linting
        run: make lint

      - name: Run Static Analysis
        run: make splint

  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  workflow-security:
    name: Audit GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          min-severity: medium
          min-confidence: medium

  image-scan:
    name: Scan Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Builds the image without publishing it. Runs on pull requests, on main
    # and on tags, where it gates the image push.
    needs: lint
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: 'recursive'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: metabase-sparql:scan

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: metabase-sparql:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: 'recursive'

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Clojure Tools
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: ${{ env.CLOJURE_CLI_VERSION }}

      - name: Cache Clojure dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clojure-tests-${{ hashFiles('deps.edn', 'metabase/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-tests-
            ${{ runner.os }}-clojure-

      # coverage runs the whole suite once, fails on a failing test and
      # enforces the coverage threshold, so a separate `make test` would only
      # repeat it.
      - name: Run Tests with Coverage
        run: make coverage

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: 'recursive'

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Clojure Tools
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: ${{ env.CLOJURE_CLI_VERSION }}

      - name: Cache Clojure dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clojure-smoke-${{ hashFiles('deps.edn', 'metabase/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-smoke-
            ${{ runner.os }}-clojure-

      - name: Run Smoke Tests
        run: make smoke

  build:
    name: Build Driver
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Release chain (build -> release -> docker push) depends on the hermetic unit
    # tests only, so a transient Docker/ghcr hiccup in `smoke` cannot block a
    # release. `smoke` still runs on every push/PR (needs: lint) as a gate for
    # merges via branch protection.
    needs: [tests]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: 'recursive'

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Clojure Tools
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: ${{ env.CLOJURE_CLI_VERSION }}

      - name: Cache Clojure dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clojure-build-${{ hashFiles('deps.edn', 'metabase/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-build-
            ${{ runner.os }}-clojure-

      - name: Build driver
        run: make build

      - name: Upload driver artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sparql-driver
          path: target/sparql.metabase-driver.jar
          if-no-files-found: error

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Tests the jar from `build` inside a real Metabase. Like `smoke`, it gates
    # merges but stays out of the release chain.
    needs: build
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: 'recursive'

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Clojure Tools
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: ${{ env.CLOJURE_CLI_VERSION }}

      - name: Cache Clojure dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clojure-e2e-${{ hashFiles('deps.edn', 'metabase/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-e2e-
            ${{ runner.os }}-clojure-

      - name: Download driver artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sparql-driver
          path: target

      - name: Run E2E Tests
        run: make e2e

  release:
    name: Release Driver
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      actions: read
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: 'recursive'

      - name: Check tag matches plugin version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A pre-release tag (v0.0.14-rc.1) matches the version it precedes.
          version=$(sed -n 's/^  version: *//p' resources/metabase-plugin.yaml | head -1)
          if [ "v$version" != "${TAG%%-*}" ]; then
            echo "::error::Tag $TAG does not match version $version in resources/metabase-plugin.yaml"
            exit 1
          fi

      - name: Download driver artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sparql-driver
          path: target

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # A tag with a suffix (v0.0.14-rc.1) is a pre-release.
          PRE=
          case "$TAG" in *-*) PRE=--prerelease ;; esac
          gh release create $TAG $PRE \
            --title="Metabase SPARQL Driver ${TAG#v}" \
            --generate-notes \
            'target/sparql.metabase-driver.jar#sparql.metabase-driver.jar'

  build-and-push-docker-image:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: 'recursive'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Metabase + SPARQL Driver
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Generate and publish image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          format: cyclonedx-json
          artifact-name: sparql-driver-image-sbom.cdx.json
          upload-release-assets: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote stable image to latest
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            "$IMAGE:$TAG"
