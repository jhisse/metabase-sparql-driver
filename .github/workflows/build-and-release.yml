name: Build and Release Driver

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Clojure Tools
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - name: Cache Clojure dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clojure-lint-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-lint-
            ${{ runner.os }}-clojure-

      - name: Run Linting
        run: make lint

      - name: Run Static Analysis
        run: make splint

  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Clojure Tools
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - name: Cache Clojure dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clojure-tests-${{ hashFiles('deps.edn', 'metabase/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-tests-
            ${{ runner.os }}-clojure-

      - name: Run Tests
        run: make test

      - name: Run Coverage
        run: make coverage

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Clojure Tools
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - name: Cache Clojure dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clojure-smoke-${{ hashFiles('deps.edn', 'metabase/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-smoke-
            ${{ runner.os }}-clojure-

      - name: Run Smoke Tests
        run: make smoke

  build:
    name: Build Driver
    runs-on: ubuntu-latest
    # Release chain (build -> release -> docker push) depends on the hermetic unit
    # tests only, so a transient Docker/ghcr hiccup in `smoke` cannot block a
    # release. `smoke` still runs on every push/PR (needs: lint) as a gate for
    # merges via branch protection.
    needs: [tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Clojure Tools
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - name: Cache Clojure dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clojure-build-${{ hashFiles('deps.edn', 'metabase/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-build-
            ${{ runner.os }}-clojure-

      - name: Build driver
        run: make build

      - name: Upload driver artifact
        uses: actions/upload-artifact@v7
        with:
          name: sparql-driver
          path: target/sparql.metabase-driver.jar
          if-no-files-found: error

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Tests the jar from `build` inside a real Metabase. Like `smoke`, it gates
    # merges but stays out of the release chain.
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Clojure Tools
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - name: Cache Clojure dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clojure-e2e-${{ hashFiles('deps.edn', 'metabase/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-e2e-
            ${{ runner.os }}-clojure-

      - name: Download driver artifact
        uses: actions/download-artifact@v8
        with:
          name: sparql-driver
          path: target

      - name: Run E2E Tests
        run: make e2e

  release:
    name: Release Driver
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Check tag matches plugin version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A pre-release tag (v0.0.14-rc.1) matches the version it precedes.
          version=$(sed -n 's/^  version: *//p' resources/metabase-plugin.yaml | head -1)
          if [ "v$version" != "${TAG%%-*}" ]; then
            echo "::error::Tag $TAG does not match version $version in resources/metabase-plugin.yaml"
            exit 1
          fi

      - name: Download driver artifact
        uses: actions/download-artifact@v8
        with:
          name: sparql-driver
          path: target

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # A tag with a suffix (v0.0.14-rc.1) is a pre-release.
          PRE=
          case "$TAG" in *-*) PRE=--prerelease ;; esac
          gh release create $TAG $PRE \
            --title="Metabase SPARQL Driver ${TAG#v}" \
            --generate-notes \
            'target/sparql.metabase-driver.jar#sparql.metabase-driver.jar'

  build-and-push-docker-image:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # :latest only moves on a stable tag, never on a pre-release.
          tags: |
            ${{ !contains(github.ref_name, '-') && format('ghcr.io/{0}:latest', github.repository) || '' }}
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Metabase + SPARQL Driver
            org.opencontainers.image.licenses=AGPL-3.0-only
