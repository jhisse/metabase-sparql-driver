version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # The Metabase base image must match the metabase/ submodule the driver
      # is built and tested against; both move together in a manual PR.
      - dependency-name: metabase/metabase
      # The builder's JDK must match the java-version in CI. The floating
      # temurin-25 tag already picks up patch releases on each build.
      - dependency-name: clojure
